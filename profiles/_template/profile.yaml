# Profile facts — exact, factual answers used to fill application forms.
# get_profile_field() maps form labels onto these keys via the alias table in
# src/data.py. Leave a value empty ("") to have the agent fall back to your
# history/context knowledge base instead of filling that field directly.
# Voluntary EEO self-identification does NOT live here — see eeo.yaml
# (local-only) alongside this file.

# --- identity ---------------------------------------------------------------
first_name: ""
last_name: ""
full_name: ""
email: ""
phone: ""                 # e.g. "310-555-0100"

# --- address ----------------------------------------------------------------
address: ""               # street address, e.g. "123 Main St Apt 4"
city: ""
state: ""                 # spelled out, e.g. "California"
zip: ""                   # ZIP code, e.g. "90001"; used in the cover-letter letterhead
country: ""               # e.g. "United States"
location: ""              # short display form, e.g. "Los Angeles, CA"

# --- links ------------------------------------------------------------------
linkedin_url: ""
github_url: ""
portfolio_url: ""
website_url: ""

# --- current role -----------------------------------------------------------
current_company: ""
current_title: ""
years_experience: ""      # number as a string, e.g. "5"

# --- eligibility / logistics ------------------------------------------------
work_authorization: ""    # full-sentence answer, e.g. "Yes, I am legally
                          # authorized to work in the United States ..."
requires_sponsorship: ""  # "Yes" or "No"
willing_to_relocate: ""   # "Yes" or "No"
how_did_you_hear: ""      # e.g. "Company careers page"

# --- compensation / availability -------------------------------------------
desired_salary: ""        # number as a string, e.g. "130000"
notice_period: ""         # e.g. "2 weeks"

# --- repeating sections (Workday "My Experience" etc.) ---------------------
# Structured blocks filled ONLY by the fill_repeating_section tool, one form
# group per entry (max 8 per section), in the order listed. They are never
# returned by get_profile_field. Dates are "YYYY-MM" ("" when unknown; a
# missing month is never invented). Leave a list empty ([]) to skip a section.
gpa_policy: "if_required"   # always | if_required | never — when to fill GPA
experience:
  - company: ""             # e.g. "Example Corp"
    title: ""               # e.g. "Product Manager"
    location: ""            # e.g. "Los Angeles, CA"
    start: ""               # "YYYY-MM", e.g. "2021-05"
    end: ""                 # "YYYY-MM"; "" when current is true
    current: false          # true -> ticks "I currently work here", skips To
    employment_type: ""     # e.g. "Full-time" (only used if the form asks)
    description: ""         # role description; use a YAML block (|) for
                            # multiple lines
education:
  - school: ""              # e.g. "Example University"
    degree: ""              # e.g. "Bachelor of Science"
    field_of_study: ""      # e.g. "Economics"
    start: ""               # "YYYY-MM" or ""
    end: ""                 # "YYYY-MM" (graduation, actual or expected)
    gpa: ""                 # e.g. "3.50"; "" to never fill

# --- misc -------------------------------------------------------------------
pronouns: ""              # e.g. "She/Her" — not an EEO field; filled into
                          # ordinary (non-self-ID) pronoun fields when present
