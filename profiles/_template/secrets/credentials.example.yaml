# Local-only account credentials for ATS tenants (e.g. Workday account creation).
#
# To use: COPY this file to `credentials.yaml` in the same directory of your real
# profile (profiles/<id>/secrets/credentials.yaml) and fill in real values.
#   - credentials.yaml is gitignored (profiles/*); NEVER commit it.
#   - It is written by YOU only. The agent never generates, invents, or writes
#     a password; it reads this file server-side via the fill_credential tool and
#     the value never appears in tool results, history, or logs.
workday:
  email: ""              # optional; falls back to the profile's email when blank
  password: "change-me"  # ONE shared password you choose, reused across tenants
