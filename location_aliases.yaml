# Curated location alias map (JOB-55) — the hand-maintained half of location
# normalization. Regex canonicalization in src/providers/locations.py handles
# the mechanical cases (US-CA- prefixes, ", CA" suffixes, "HQ"/"Office" noise);
# this file catches what regex can't: abbreviations, nicknames, and typos seen
# on real boards.
#
# Keys are matched case-insensitively AFTER regex cleanup. Values are the
# canonical display name. Curation loop: review the location_observations
# table in data/postings.db (raw token → derived canonical, with counts),
# add corrections here, and the next refresh re-normalizes everything.

aliases:
  # -- abbreviations / nicknames
  sf: San Francisco
  sfo: San Francisco
  san francisco bay area: San Francisco
  sf bay area: San Francisco
  bay area: San Francisco
  nyc: New York
  new york city: New York
  sea: Seattle
  chi: Chicago
  la: Los Angeles
  dc: Washington, DC
  washington dc: Washington, DC
  washington d.c.: Washington, DC
  atl: Atlanta
  # -- typos seen on live boards
  san fransisco: San Francisco
  cananda: Canada
  # -- country / region spellings
  us: United States
  u.s.: United States
  usa: United States
  united states of america: United States
  america: United States
  uk: United Kingdom
  great britain: United Kingdom
  england: United Kingdom
  # -- non-locations that should be dropped entirely (map to empty)
  n/a: ""
  tbd: ""
  anywhere: ""
  flexible: ""

# Curated metros OUTSIDE the countries the user can work in (JOB-123), grouped
# by the country they belong to. Used only by the remote-scope deny-list in
# src/providers/locations.foreign_scope: a REMOTE posting is dropped when its
# raw location string carries one of these (or a non-allowed country / remote
# scope) and NO allowed signal. Cities that also exist in the US (Dublin,
# Berlin, Paris, Vienna) are safe here because a US listing carries a state
# qualifier (", CA", "Ohio") that wins first.
#
# The grouping is what makes the baseline's optional `allowed_countries` knob
# (job_criteria.yaml -> baseline) work in both directions: allow "Canada" and
# the Canadian metros below stop counting as foreign. When the knob is absent
# it derives to the US plus any country already named in locations_allowed /
# relocation_targets.

foreign_scope:
